<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<style>
  :root {
    --bg: #000;
    --glass: rgba(9, 12, 26, 0.72);
    --glass-strong: rgba(9, 12, 26, 0.86);
    --line: rgba(170, 190, 255, 0.14);
    --line-strong: rgba(170, 190, 255, 0.28);
    --text: #e9edf9;
    --muted: #8f98b8;
    --accent: #ffe6a8;
    --warn: #ffb86b;
    --radius: 18px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  #galaxy { position: fixed; inset: 0; }

  /* HUD */
  .hud { position: fixed; top: 22px; left: 24px; pointer-events: none; max-width: 300px; }
  .hud h1 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: #cfd6f3; }
  .hud .stats { margin: 6px 0 14px; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
  .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .legend li { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #c3cae4; text-transform: capitalize; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 10px 1px currentColor; background: currentColor; flex: none; }
  .legend .n { color: var(--muted); margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .hint { position: fixed; top: 22px; right: 24px; font-size: 11.5px; color: var(--muted); letter-spacing: .03em; pointer-events: none; transition: opacity .4s; }
  body.panel-open .hint { opacity: 0; }

  /* star labels (HTML, so bloom never blurs them) */
  .star-label {
    font: 600 12px/1 var(--font); color: #f3f5fc; white-space: nowrap; pointer-events: none;
    padding: 4px 9px; border-radius: 999px; background: rgba(5, 7, 16, .62); border: 1px solid rgba(255,255,255,.09);
    text-shadow: 0 1px 2px #000; letter-spacing: .01em;
  }
  .star-label.focus { font-size: 13.5px; padding: 5px 11px; background: rgba(5, 7, 16, .8); border-color: rgba(255,230,168,.4); color: var(--accent); }

  /* hover tooltip from 3d-force-graph */
  .float-tooltip-kap { background: transparent !important; padding: 0 !important; }
  .tip { background: var(--glass-strong); border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 11px; font: 13px/1.35 var(--font); color: var(--text); backdrop-filter: blur(10px); }
  .tip b { font-weight: 600; display: block; }
  .tip span { color: var(--muted); font-size: 11.5px; text-transform: capitalize; }

  /* Side panel */
  #panel {
    position: fixed; top: 16px; right: 16px; bottom: 16px; width: 390px; max-width: calc(100vw - 32px);
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    transform: translateX(calc(100% + 32px)); opacity: 0;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s;
    display: flex; flex-direction: column; overflow: hidden; z-index: 5;
  }
  #panel.open { transform: none; opacity: 1; }
  .panel-head { padding: 22px 22px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  #panel h2 { margin: 10px 36px 6px 0; font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
  .meta { color: var(--muted); font-size: 12px; }
  .close { position: absolute; top: 16px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .close:hover { color: var(--text); border-color: var(--line); background: rgba(255,255,255,.04); }
  .panel-body { padding: 16px 22px 22px; overflow-y: auto; flex: 1; }
  .excerpt { white-space: pre-wrap; color: #d3d9ee; font-size: 13.5px; line-height: 1.62; margin: 0 0 22px; }
  .section-label { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .neighbours { display: flex; flex-wrap: wrap; gap: 6px; }
  .note-chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); cursor: pointer; font-size: 12.5px; color: #dfe4f5;
    transition: border-color .2s, background .2s;
  }
  .note-chip:hover { border-color: var(--line-strong); background: rgba(255,255,255,.07); }
  .note-chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .note-chip span { color: #dfe4f5; }

  /* Chat */
  #chat {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px)); z-index: 6; display: flex; flex-direction: column; gap: 10px;
    transition: left .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1);
  }
  body.panel-open #chat { left: calc((100vw - 422px) / 2); width: min(720px, calc(100vw - 422px - 32px)); }
  #answer {
    background: var(--glass-strong); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 14px 18px 16px; max-height: 42vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: rise .35s cubic-bezier(.2,.8,.2,1);
  }
  #answer[hidden] { display: none; }
  #answer.error { border-color: rgba(255,184,107,.35); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .answer-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .asked { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-btn { background: none; border: 0; padding: 2px 4px; color: var(--muted); font-size: 12px; cursor: pointer; border-radius: 6px; }
  .link-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .answer-text { font-size: 15px; line-height: 1.6; color: var(--text); margin: 0; }
  #answer.error .answer-text { color: #ffd9ae; }
  .sources { margin-top: 12px; }
  .sources[hidden] { display: none; }
  .sources .section-label { margin-bottom: 8px; }
  .thinking { display: inline-flex; gap: 5px; padding: 6px 0; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite ease-in-out; }
  .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

  #ask {
    display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px 0 22px; border-radius: 999px;
    background: var(--glass-strong); border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 16px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    transition: border-color .25s, box-shadow .25s;
  }
  #ask:focus-within { border-color: rgba(255,230,168,.4); box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 0 4px rgba(255,230,168,.06); }
  #q { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font: 15px var(--font); }
  #q::placeholder { color: #6f789a; }
  #send {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    background: linear-gradient(135deg, #ffe6a8, #f5b971); color: #1b1407; display: grid; place-items: center;
    transition: transform .15s, opacity .2s;
  }
  #send:hover { transform: scale(1.06); }
  #send:disabled { opacity: .45; cursor: default; transform: none; }
  kbd { font: 11px var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

  #notice {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; z-index: 10;
    color: var(--muted); font-size: 15px; line-height: 1.7;
  }
  #notice[hidden] { display: none; }
  #notice code { color: var(--accent); background: rgba(255,255,255,.06); padding: 2px 7px; border-radius: 6px; }

  @media (max-width: 760px) {
    .hud { top: 16px; left: 16px; }
    .legend, .hint { display: none; }
    #panel { top: auto; left: 8px; right: 8px; bottom: 90px; width: auto; max-height: 52vh; transform: translateY(calc(100% + 110px)); }
    body.panel-open #chat { left: 50%; width: calc(100vw - 16px); }
    #chat { width: calc(100vw - 16px); bottom: 12px; }
    #answer { max-height: 34vh; }
    body.panel-open #answer { display: none; }         /* one card at a time on small screens */
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
} }
</script>
</head>
<body>
<div id="galaxy"></div>

<header class="hud">
  <h1>Knowledge Galaxy</h1>
  <p class="stats" id="stats"></p>
  <ul class="legend" id="legend"></ul>
</header>
<div class="hint">Drag to orbit · scroll to zoom · click a star</div>

<aside id="panel" aria-hidden="true" aria-label="Note details">
  <div class="panel-head">
    <span class="chip" id="p-group"><i></i><span></span></span>
    <h2 id="p-title"></h2>
    <div class="meta" id="p-meta"></div>
    <button class="close" id="p-close" aria-label="Close note">×</button>
  </div>
  <div class="panel-body">
    <p class="excerpt" id="p-excerpt"></p>
    <p class="section-label" id="p-nlabel">Connected notes</p>
    <div class="neighbours" id="p-neighbours"></div>
  </div>
</aside>

<div id="chat">
  <div id="answer" hidden aria-live="polite">
    <div class="answer-head">
      <span class="asked" id="a-asked"></span>
      <button class="link-btn" id="a-new" type="button" title="Forget this conversation">New chat</button>
      <button class="link-btn" id="a-close" type="button" aria-label="Hide answer">✕</button>
    </div>
    <div id="a-body"></div>
    <div class="sources" id="a-sources" hidden>
      <p class="section-label" id="a-slabel">From your notes</p>
      <div class="neighbours" id="a-chips"></div>
    </div>
  </div>
  <form id="ask" autocomplete="off">
    <input id="q" type="text" maxlength="1000" placeholder="Ask your notes anything…" aria-label="Ask your notes a question">
    <kbd id="kbd-hint">/</kbd>
    <button id="send" type="submit" aria-label="Ask">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<div id="notice" hidden></div>

<script src="graph-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>
<script type="module">
const $ = (s) => document.querySelector(s);
const showNotice = (html) => { const el = $('#notice'); el.innerHTML = html; el.hidden = false; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function main() {
  if (typeof GRAPH === 'undefined') {
    showNotice('No graph data yet.<br>Run <code>python3 build.py /path/to/your/notes</code> and refresh.');
    return;
  }
  if (typeof ForceGraph3D === 'undefined') {
    showNotice("Couldn't load the 3D engine from cdn.jsdelivr.net.<br>Check your internet connection and refresh.");
    return;
  }
  // three.js extras (glow sprites, starfield, bloom). The graph still works without them.
  let THREE = null, UnrealBloomPass = null, CSS2DRenderer = null, CSS2DObject = null;
  try {
    THREE = await import('three');
    [{ UnrealBloomPass }, { CSS2DRenderer, CSS2DObject }] = await Promise.all([
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/renderers/CSS2DRenderer.js'),
    ]);
  } catch (err) {
    console.warn('three.js extras unavailable, falling back to plain nodes', err);
  }

  const nodes = GRAPH.nodes;
  const links = GRAPH.links;
  if (!nodes.length) {
    showNotice('Your notes folder has no .md files yet.<br>Add some and run <code>python3 build.py</code> again.');
    return;
  }

  // ------------------------------------------------------------ data prep
  const adj = nodes.map(() => new Map());                   // neighbour id -> link
  for (const l of links) { adj[l.source].set(l.target, l); adj[l.target].set(l.source, l); }
  const PALETTE = ['#5eead4', '#f472b6', '#a78bfa', '#fbbf24', '#60a5fa', '#fb7185', '#34d399', '#fb923c', '#c084fc', '#22d3ee', '#facc15', '#e879f9'];
  const groups = [...new Set(nodes.map((n) => n.group))].sort((a, b) => a.localeCompare(b));
  const groupColor = new Map(groups.map((g, i) => [g, PALETTE[i] || `hsl(${Math.round(i * 137.508) % 360}, 85%, 66%)`]));
  const colorOf = (n) => groupColor.get(n.group);
  for (const n of nodes) n.r = 2 + Math.sqrt(adj[n.id].size) * 1.15;

  $('#stats').textContent = `${nodes.length} notes · ${links.length} connections · ${groups.length} groups`;
  const counts = Object.fromEntries(groups.map((g) => [g, 0]));
  nodes.forEach((n) => counts[n.group]++);
  $('#legend').innerHTML = groups.map((g) =>
    `<li style="color:${groupColor.get(g)}"><span class="dot"></span><span style="color:#c3cae4">${esc(g)}</span><span class="n">${counts[g]}</span></li>`).join('');

  // ------------------------------------------------------------ highlight state
  const state = { focus: null, lit: new Set(), litLinks: new Set() };
  const linkEnds = (l) => [typeof l.source === 'object' ? l.source.id : l.source, typeof l.target === 'object' ? l.target.id : l.target];

  // ------------------------------------------------------------ node visuals
  let glowTex = null, sphereGeo = null;
  if (THREE) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.18, 'rgba(255,255,255,.55)');
    grad.addColorStop(0.45, 'rgba(255,255,255,.12)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    glowTex = new THREE.CanvasTexture(c);
    glowTex.colorSpace = THREE.SRGBColorSpace;
    sphereGeo = new THREE.SphereGeometry(1, 24, 16);
  }
  const WHITE = THREE ? new THREE.Color('#ffffff') : null;
  const GLOW = 4.6;                                      // halo size relative to the star

  function makeNodeObject(n) {
    const color = new THREE.Color(colorOf(n));
    const obj = new THREE.Group();
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    const core = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: color.clone().lerp(WHITE, 0.3), transparent: true }));
    const hit = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    core.scale.setScalar(n.r);
    hit.scale.setScalar(n.r * 1.7);                     // a slightly larger, invisible click target
    glow.scale.setScalar(n.r * GLOW);
    glow.raycast = () => {};                             // halos overlap; only the star itself is clickable
    obj.add(glow, core, hit);
    n.__v = { core, glow, label: null, phase: Math.random() * Math.PI * 2, glowBase: 0.5, glowScale: 1 };
    return obj;
  }

  function makeLabel(n) {
    const el = document.createElement('div');
    el.className = 'star-label';
    el.textContent = n.label;
    const label = new CSS2DObject(el);
    label.center.set(0.5, 1.35);                         // sit just above the star
    label.position.y = n.r;
    return label;
  }

  function setLabel(n, show, focus) {
    const v = n.__v; if (!v || !CSS2DObject) return;
    if (show && !v.label) { v.label = makeLabel(n); v.core.parent.add(v.label); }
    if (v.label) { v.label.visible = show; v.label.element.classList.toggle('focus', !!focus); }
  }

  function applyHighlight() {
    const any = state.lit.size > 0;
    for (const n of nodes) {
      const v = n.__v; if (!v) continue;
      const on = state.lit.has(n.id), isFocus = n.id === state.focus;
      v.core.material.opacity = !any || on ? 1 : 0.13;
      v.glowBase = !any ? 0.5 : on ? (isFocus ? 0.95 : 0.75) : 0.04;
      v.glowScale = isFocus ? 1.35 : any && on ? 1.12 : 1;
      setLabel(n, any && on, isFocus);
    }
    Graph.linkColor(Graph.linkColor()).linkDirectionalParticles(Graph.linkDirectionalParticles());
    if (!THREE) Graph.nodeColor(Graph.nodeColor());
  }

  // ------------------------------------------------------------ graph
  const labelRenderer = CSS2DRenderer ? new CSS2DRenderer() : null;
  const Graph = new ForceGraph3D($('#galaxy'), { controlType: 'orbit', extraRenderers: labelRenderer ? [labelRenderer] : [] })
    .backgroundColor('#000000')
    .showNavInfo(false)
    .nodeId('id')
    .nodeLabel((n) => `<div class="tip"><b>${esc(n.label)}</b><span>${esc(n.group)}</span></div>`)
    .nodeVal((n) => n.r * n.r / 2)
    .nodeColor((n) => (!state.lit.size || state.lit.has(n.id) ? colorOf(n) : 'rgba(80,90,120,0.25)'))
    .nodeOpacity(0.95)
    .linkColor((l) => {
      if (!state.lit.size) return l.type === 'mention' ? 'rgba(150,175,255,0.30)' : 'rgba(150,175,255,0.13)';
      return state.litLinks.has(l) ? 'rgba(255,232,180,0.95)' : 'rgba(150,175,255,0.035)';
    })
    .linkOpacity(1)
    .linkWidth(0)
    .linkDirectionalParticles((l) => (state.litLinks.has(l) ? 3 : 0))
    .linkDirectionalParticleWidth(1.4)
    .linkDirectionalParticleSpeed(0.0055)
    .linkDirectionalParticleColor(() => '#ffe6a8')
    .enableNodeDrag(false)
    .warmupTicks(90)
    .cooldownTicks(160)
    .onNodeHover((n) => { document.body.style.cursor = n ? 'pointer' : ''; })
    .onNodeClick((n) => focusNode(n))
    .onBackgroundClick(() => clearHighlight());
  if (THREE) Graph.nodeThreeObject(makeNodeObject);
  Graph.d3Force('charge').strength(-150);
  Graph.d3Force('link').distance((l) => (l.type === 'mention' ? 42 : 70));
  Graph.graphData({ nodes, links });

  // ------------------------------------------------------------ cinematic scene
  const controls = Graph.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  let idleTimer = null;
  function pauseRotation(ms = 7000) {
    controls.autoRotate = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { controls.autoRotate = true; }, ms);
  }
  const canvasEl = Graph.renderer().domElement;
  ['pointerdown', 'wheel', 'touchstart'].forEach((ev) => canvasEl.addEventListener(ev, () => pauseRotation(), { passive: true }));

  const camera = Graph.camera();
  camera.far = 30000; camera.updateProjectionMatrix();

  if (THREE) {
    const scene = Graph.scene();
    const starLayer = (count, size, opacity, rMin, rMax) => {
      const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
      const tints = [[1, 1, 1], [0.75, 0.83, 1], [1, 0.9, 0.78], [0.85, 0.8, 1]];
      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
        const r = rMin + Math.random() * (rMax - rMin);
        pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
        const k = 0.45 + Math.random() * 0.55, tint = tints[(Math.random() * tints.length) | 0];
        col.set([tint[0] * k, tint[1] * k, tint[2] * k], i * 3);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({
        size, map: glowTex, vertexColors: true, transparent: true, opacity, depthWrite: false,
        sizeAttenuation: false, blending: THREE.AdditiveBlending,
      }));
      pts.raycast = () => {};
      scene.add(pts);
      return pts;
    };
    const stars = [starLayer(5200, 3, 0.8, 3000, 9000), starLayer(420, 6, 0.95, 3000, 9000)];

    // faint nebula clouds far behind everything
    [['#6d4bd8', [-4200, 1400, -5200], 5200], ['#1f8fa8', [4600, -1800, -3800], 4600], ['#b0457c', [800, 3800, 5200], 4200]]
      .forEach(([color, p, size]) => {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 0.09, depthWrite: false, blending: THREE.AdditiveBlending }));
        s.position.set(...p); s.scale.setScalar(size); s.raycast = () => {};
        scene.add(s);
      });

    if (UnrealBloomPass) {
      try {
        const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.5, 0.18);
        Graph.postProcessingComposer().addPass(bloom);
      } catch (err) { console.warn('Bloom unavailable', err); }
    }

    // gentle breathing glow + slow drift of the starfield
    const t0 = performance.now();
    (function animate() {
      const t = (performance.now() - t0) / 1000;
      for (const n of nodes) {
        const v = n.__v; if (!v) continue;
        const pulse = Math.sin(t * 1.3 + v.phase);
        v.glow.material.opacity = v.glowBase * (0.86 + 0.14 * pulse);
        v.glow.scale.setScalar(n.r * GLOW * v.glowScale * (1 + 0.05 * pulse));
      }
      stars.forEach((s, i) => { s.rotation.y = t * (0.004 + i * 0.002); });
      requestAnimationFrame(animate);
    })();
  }

  // opening shot: start far out, then glide in once the layout settles
  let introDone = false;
  const intro = () => { if (introDone) return; introDone = true; Graph.zoomToFit(2200, 60); };
  Graph.onEngineStop(intro);
  setTimeout(intro, 2500);

  addEventListener('resize', () => {
    Graph.width(innerWidth).height(innerHeight);
    reframe();
  });

  // ------------------------------------------------------------ focus a note
  function flyTo(n, ms = 1600) {
    pauseRotation(ms + 2500);
    const d = 95 + n.r * 6;
    const len = Math.hypot(n.x, n.y, n.z);
    const pos = len < 1 ? { x: 0, y: 0, z: d } : { x: n.x * (1 + d / len), y: n.y * (1 + d / len), z: n.z * (1 + d / len) };
    Graph.cameraPosition(pos, { x: n.x, y: n.y, z: n.z }, ms);
  }

  function chipHTML(n) {
    return `<button class="note-chip" type="button" data-id="${n.id}" style="color:${colorOf(n)}"><i></i><span>${esc(n.label)}</span></button>`;
  }

  function focusNode(n, fly = true) {
    state.focus = n.id;
    state.lit = new Set([n.id, ...adj[n.id].keys()]);
    state.litLinks = new Set(adj[n.id].values());
    applyHighlight();
    openPanel(n);
    if (fly) flyTo(n);
  }

  function clearHighlight() {
    state.focus = null; state.lit = new Set(); state.litLinks = new Set();
    applyHighlight();
    closePanel();
  }

  // Shift the camera's view so what you're looking at sits in the open space beside the panel / above the answer.
  const view = { x: 0, y: 0 };
  let shiftAnim = 0;
  function shiftView(tx, ty) {
    cancelAnimationFrame(shiftAnim);
    const from = { ...view }, start = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - start) / 550), ease = 1 - Math.pow(1 - k, 3);
      view.x = from.x + (tx - from.x) * ease;
      view.y = from.y + (ty - from.y) * ease;
      const w = Graph.width(), h = Graph.height(), x = Math.round(view.x), y = Math.round(view.y);
      if (x || y) camera.setViewOffset(w, h, x, y, w, h); else camera.clearViewOffset();
      if (k < 1) shiftAnim = requestAnimationFrame(step);
    };
    shiftAnim = requestAnimationFrame(step);
  }
  const wide = () => innerWidth > 760;
  const panelShift = () => (wide() && document.body.classList.contains('panel-open') ? Math.round(($('#panel').offsetWidth + 16) / 2) : 0);
  const answerShift = () => (wide() && !$('#answer').hidden ? Math.round(($('#answer').offsetHeight + 10) / 2) : 0);
  const reframe = () => shiftView(panelShift(), answerShift());

  function openPanel(n) {
    const color = colorOf(n);
    const chip = $('#p-group'); chip.style.color = color; chip.querySelector('span').textContent = n.group;
    $('#p-title').textContent = n.label;
    const nb = [...adj[n.id].entries()].sort((a, b) => b[1].value - a[1].value).map(([id]) => nodes[id]);
    $('#p-meta').textContent = `${n.file} · ${n.words.toLocaleString()} words · ${nb.length} connection${nb.length === 1 ? '' : 's'}`;
    $('#p-excerpt').textContent = n.excerpt || '(empty note)';
    $('#p-nlabel').hidden = !nb.length;
    $('#p-neighbours').innerHTML = nb.map(chipHTML).join('');
    $('#panel .panel-body').scrollTop = 0;
    $('#panel').classList.add('open');
    $('#panel').setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
    reframe();
  }

  function closePanel() {
    $('#panel').classList.remove('open');
    $('#panel').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    reframe();
  }

  $('#p-close').addEventListener('click', clearHighlight);
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.note-chip');
    if (chip) focusNode(nodes[+chip.dataset.id]);
  });

  // ------------------------------------------------------------ chat
  const SESSION = (() => {
    try {
      let id = sessionStorage.getItem('galaxy-session');
      if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2); sessionStorage.setItem('galaxy-session', id); }
      return id;
    } catch { return 'default'; }
  })();
  const answerEl = $('#answer'), input = $('#q'), sendBtn = $('#send');
  let busy = false;

  function renderAnswer({ question, text, error, loading, ids = [] }) {
    answerEl.hidden = false;
    answerEl.classList.toggle('error', !!error);
    $('#a-asked').textContent = question ? `You asked: ${question}` : '';
    $('#a-body').innerHTML = loading
      ? '<div class="thinking" aria-label="Thinking"><i></i><i></i><i></i></div>'
      : `<p class="answer-text">${esc(error || text)}</p>`;
    const valid = ids.filter((i) => Number.isInteger(i) && nodes[i]);
    $('#a-sources').hidden = loading || !valid.length;
    $('#a-slabel').textContent = error ? 'Closest notes' : 'From your notes';
    $('#a-chips').innerHTML = valid.map((i) => chipHTML(nodes[i])).join('');
  }

  function lightAnswer(ids) {
    const valid = ids.filter((i) => Number.isInteger(i) && nodes[i]);
    closePanel();                                        // also reframes above the answer card
    state.focus = null;
    state.lit = new Set(valid);
    state.litLinks = new Set(links.filter((l) => { const [a, b] = linkEnds(l); return state.lit.has(a) && state.lit.has(b); }));
    applyHighlight();
    if (valid.length === 1) flyTo(nodes[valid[0]], 1800);
    else if (valid.length > 1) { pauseRotation(4500); Graph.zoomToFit(1800, 90, (n) => state.lit.has(n.id)); }
  }

  $('#ask').addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question || busy) return;
    busy = true; sendBtn.disabled = true;
    renderAnswer({ question, loading: true });
    let data;
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, session: SESSION }),
      });
      data = await res.json().catch(() => ({ error: `The server answered ${res.status} without JSON.` }));
    } catch {
      data = { error: "Can't reach the server. Is server.py still running?" };
    }
    busy = false; sendBtn.disabled = false;
    const ids = Array.isArray(data.nodes) ? data.nodes : [];
    renderAnswer({ question, text: data.answer, error: data.error || (!data.answer && 'No answer came back.'), ids });
    lightAnswer(ids);
    if (!data.error) input.value = '';
  });

  $('#a-close').addEventListener('click', () => { answerEl.hidden = true; clearHighlight(); });
  $('#a-new').addEventListener('click', async () => {
    answerEl.hidden = true; input.value = ''; clearHighlight(); input.focus();
    try {
      await fetch('/chat/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session: SESSION }) });
    } catch { /* nothing to reset if the server is gone */ }
  });

  addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
    if (e.key === 'Escape') {
      if (document.activeElement === input && input.value) { input.value = ''; return; }
      clearHighlight(); input.blur();
    }
  });
  input.addEventListener('focus', () => { $('#kbd-hint').style.visibility = 'hidden'; });
  input.addEventListener('blur', () => { $('#kbd-hint').style.visibility = ''; });

  window.galaxy = { Graph, nodes, focusNode, clearHighlight };     // handy from the dev console
}

main().catch((err) => {
  console.error(err);
  showNotice(`Something went wrong drawing the galaxy.<br><code>${esc(err.message || err)}</code>`);
});
</script>
</body>
</html>
